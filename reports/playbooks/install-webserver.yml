---
- name: Install and configure Apache2 web server
  hosts: web1
  become: true

  vars:
    web_package: apache2
    web_root: /var/www/html

  tasks:

    - name: Update package cache
      apt:
        update_cache: yes

    - name: Install Apache2 web server
      apt:
        name: "{{ web_package }}"
        state: present

    - name: Create index.html
      copy:
        dest: "{{ web_root }}/index.html"
        content: |
          <h1>Tervetuloa {{ inventory_hostname }}-palvelimelle!</h1>
      notify: restart apache2

    - name: Ensure Apache2 service is running
      shell: |
        if ! pgrep -x apache2 >/dev/null; then
          apachectl start
          echo "STARTED"
        fi
      register: apache_start
      changed_when: "'STARTED' in apache_start.stdout"

    - name: Verify web server responds
      uri:
        url: http://localhost
        status_code: 200
        return_content: yes
      register: web_result

    - name: Display verification
      debug:
        msg: "Web server running on {{ inventory_hostname }}: {{ web_result.content | trim }}"

  handlers:

    - name: restart apache2
      shell: apachectl restart